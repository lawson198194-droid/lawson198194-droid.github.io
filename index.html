<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>LIONS BLACK · 出場音樂</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#121935; --panel2:#1a2244;
    --gold:#ffce4d; --gold2:#ffb300; --txt:#eef2ff; --sub:#9aa6cf;
    --accent:#3da9fc; --live:#ff5252;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:"Segoe UI",-apple-system,"PingFang HK","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1b2550 0%, var(--bg) 60%);
    color:var(--txt); min-height:100vh; padding:16px; max-width:760px; margin:0 auto;
  }
  h1{font-size:22px; text-align:center; margin:6px 0 14px; letter-spacing:1px;}
  h1 .hl{color:var(--gold);}

  /* NOW PLAYING */
  .now{
    background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid #2a3566; border-radius:16px; padding:16px; margin-bottom:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.4); text-align:center; position:relative; overflow:hidden;
  }
  .now .tag{display:inline-block; font-size:11px; letter-spacing:2px; color:var(--live); font-weight:700;}
  .now .num{font-size:46px; font-weight:800; color:var(--gold); line-height:1; margin:6px 0;}
  .now .nm{font-size:20px; font-weight:700;}
  .now .nk{font-size:15px; color:var(--accent); margin-top:2px; font-style:italic;}
  .now.idle .num{color:#56608c;}
  .pulse{position:absolute; inset:0; background:radial-gradient(circle at 50% 120%, rgba(255,82,82,.18),transparent 60%); opacity:0; transition:opacity .3s;}
  .now.playing .pulse{opacity:1; animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.5;}50%{transform:scale(1.05);opacity:1;}}

  /* 唯一的按鈕：停止 */
  .stopbar{display:flex; justify-content:center; margin-bottom:14px;}
  button.stop{
    width:100%; max-width:260px; height:52px; font-size:18px; font-weight:800; letter-spacing:4px;
    color:#fff; background:linear-gradient(180deg,#7a2b32,#5a1f25);
    border:2px solid #a5424a; border-radius:14px; cursor:pointer;
  }
  button.stop:active{transform:translateY(2px);}

  /* 卡片 */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .card{
    background:var(--panel); border:1px solid #2a3566; border-radius:14px; padding:12px 8px;
    text-align:center; cursor:pointer; transition:transform .08s, border-color .15s, background .15s;
    user-select:none;
  }
  .card:active{transform:scale(.96);}
  .card.active{border-color:var(--gold); background:var(--panel2); box-shadow:0 0 0 2px rgba(255,206,77,.25);}
  .card .cnum{font-size:28px; font-weight:800; color:var(--gold);}
  .card .cnm{font-size:13px; font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .cnk{font-size:11px; color:var(--accent); font-style:italic; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .tcard{
    grid-column:1 / -1; background:linear-gradient(135deg,#222b50,#15203f);
    border:1px dashed #3a4a86; border-radius:14px; padding:14px; text-align:center; cursor:pointer;
    margin-top:4px;
  }
  .tcard .cnum{color:var(--accent); font-size:24px; font-weight:800;}
  .tcard .cnm{font-size:15px; font-weight:700;}

  footer{text-align:center; color:#56608c; font-size:11px; margin-top:18px;}
  audio{display:none;}
  details.setup{margin-top:14px; background:var(--panel); border:1px solid #2a3566; border-radius:14px; padding:10px 14px; font-size:12px; color:var(--sub); line-height:1.7;}
  details.setup summary{cursor:pointer; color:var(--gold); font-weight:700; font-size:13px; list-style:none;}
  details.setup summary::-webkit-details-marker{display:none;}
  details.setup summary::before{content:"\25B8  ";}
  details.setup[open] summary::before{content:"\25BE  ";}
  details.setup div{margin-top:8px;}
  .aw{color:var(--gold); font-weight:700;}
</style>
</head>
<body>
  <h1>LIONS <span class="hl">BLACK</span> 出場音樂</h1>

  <div class="now idle" id="now">
    <div class="pulse"></div>
    <div class="tag" id="nowTag">待命</div>
    <div class="num" id="nowNum">—</div>
    <div class="nm" id="nowName">點擊卡片播放</div>
    <div class="nk" id="nowNick"></div>
  </div>

  <div class="stopbar"><button class="stop" id="stopBtn">停 止</button></div>

  <div class="grid" id="grid"></div>

  <details class="setup">
    <summary>手機 / 藍牙設定</summary>
    <div>先連藍牙音箱 → 音量調到最大 → 點卡片播放。播放時螢幕常亮：<span class="aw" id="awakeState">待播放</span>。iPhone 請把「自動鎖定」設為永不。藍牙音箱按鍵可暫停／切歌。</div>
  </details>

  <footer>點擊卡片播放 · 停止鍵結束 · v25 極簡版</footer>

  <audio id="audio" preload="auto" playsinline webkit-playsinline x-webkit-airplay="allow"></audio>

<script>
const players = {
  90:{name:"Ellie Luo",     nick:"Lightning Warrior", file:"LIONS_BLACK_90_ELLIE_LUO.mp3"},
  50:{name:"Chenglin Bi",   nick:"Iron Wall",         file:"LIONS_BLACK_50_CHENGLIN_BI.mp3"},
  14:{name:"Daniel Ma",     nick:"Speed Demon",       file:"LIONS_BLACK_14_DANIEL_MA.mp3"},
  32:{name:"David Lu",      nick:"Clutch Hitter",     file:"LIONS_BLACK_32_David_Lu.mp3"},
  9: {name:"Elvis Kwok",    nick:"King of Swing",     file:"LIONS_BLACK_09_Elvis_Kwok.mp3"},
  99:{name:"Hayley Mak",    nick:"Storm Breaker",     file:"LIONS_BLACK_99_Hayley_Mak.mp3"},
  18:{name:"Ian Chan",      nick:"Golden Arm",        file:"LIONS_BLACK_18_Ian_Chan.mp3"},
  59:{name:"Kosmo Li",      nick:"Speed Racer",       file:"LIONS_BLACK_59_Kosmo_Li.mp3"},
  26:{name:"Lucas Ng",      nick:"Sharp Shooter",     file:"LIONS_BLACK_26_Lucas_Ng.mp3"},
  46:{name:"Teresa Xu",     nick:"Fire Spark",        file:"LIONS_BLACK_46_Teresa_Xu.mp3"},
  3: {name:"Wesley Wei",    nick:"Triple Threat",     file:"LIONS_BLACK_03_Wesley_Wei.mp3"},
  39:{name:"William Wang",  nick:"Titan Crusher",     file:"LIONS_BLACK_39_William_Wang.mp3"},
  100:{name:"完整音樂",       nick:"FULL STADIUM ANTHEM", file:"LIONS_BLACK_100_FULL_MUSIC.mp3"}
};
const transition = {name:"換場音樂", nick:"30s · Transition", file:"LIONS_BLACK_TRANSITION_30s.mp3"};
const closer = {name:"終結者 CLOSER", nick:"薩克斯風 · 17s", file:"LIONS_BLACK_00_CLOSER.mp3"};

const SHARE = new URLSearchParams(location.search).get('sharecode');
const audio = document.getElementById('audio');
const nowBox = document.getElementById('now');
const nowNum = document.getElementById('nowNum');
const nowName = document.getElementById('nowName');
const nowNick = document.getElementById('nowNick');
const nowTag = document.getElementById('nowTag');
let activeCard = null;

function resolve(num){
  num = String(num).trim();
  if(num === "0")  return {key:0, ...transition, number:0};
  if(num === "00") return {key:"00", ...closer, number:"00"};
  const p = players[Number(num)];
  if(p) return {key:Number(num), ...p, number:Number(num)};
  return null;
}

function clearActive(){
  if(activeCard){ activeCard.classList.remove('active'); activeCard=null; }
}

function play(num){
  const item = resolve(num);
  if(!item){ flash("無法播放"); return; }
  audio.pause();
  audio.src = item.file + '?v=25' + (SHARE ? '&sharecode=' + encodeURIComponent(SHARE) : '');
  currentNum = num; setMedia(item); keepAwake(true);
  clearActive();
  const card = document.querySelector('.card[data-num="'+item.number+'"]');
  if(card){ card.classList.add('active'); activeCard = card; }
  nowBox.classList.remove('idle');
  nowBox.classList.add('playing');
  nowTag.textContent = (item.number===0) ? "換場" : (item.number==="00") ? "終結者 · CLOSER" : (item.number===100 ? "完整音樂" : "上場 · NOW PLAYING");
  nowNum.textContent = (item.number===0) ? "0" : (item.number==="00") ? "00" : ("#"+item.number);
  nowName.textContent = item.name;
  nowNick.textContent = item.nick;
  audio.play().catch(()=>{ flash("點一下頁面再試（瀏覽器限制自動播放）"); });
}

function stop(){
  keepAwake(false);
  audio.pause();
  audio.currentTime = 0;
  nowBox.classList.add('idle');
  nowBox.classList.remove('playing');
  nowTag.textContent = "待命";
  nowNum.textContent = "—";
  nowName.textContent = "點擊卡片播放";
  nowNick.textContent = "";
  clearActive();
}

let flashTimer=null;
function flash(msg){
  nowName.textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ if(nowBox.classList.contains('idle')) nowName.textContent="點擊卡片播放"; }, 1800);
}

// 12 張球員卡
const grid = document.getElementById('grid');
const SPECIAL = new Set([0,100]);
Object.keys(players).map(Number).filter(n=>!SPECIAL.has(n)).sort((a,b)=>a-b).forEach(n=>{
  const p = players[n];
  const c = document.createElement('div');
  c.className='card'; c.dataset.num=n;
  c.innerHTML = '<div class="cnum">'+n+'</div><div class="cnm">'+p.name+'</div><div class="cnk">'+p.nick+'</div>';
  c.addEventListener('click', ()=>play(n));
  grid.appendChild(c);
});

// 三段音樂：換場 / 終結者 CLOSER / 完整音樂
const specials = [
  {n:0,    cnum:"0 · 換場音樂",        cnm:"30s · Transition"},
  {n:"00", cnum:"00 · 終結者 CLOSER", cnm:"薩克斯風 · 17s"},
  {n:100,  cnum:"100 · 完整音樂",     cnm:"FULL STADIUM ANTHEM · 2:56"}
];
specials.forEach(s=>{
  const c = document.createElement('div');
  c.className='tcard card'; c.dataset.num=s.n;
  c.innerHTML = '<div class="cnum">'+s.cnum+'</div><div class="cnm">'+s.cnm+'</div>';
  c.addEventListener('click', ()=>play(s.n));
  grid.appendChild(c);
});

document.getElementById('stopBtn').addEventListener('click', stop);
audio.addEventListener('ended', ()=>{
  keepAwake(false);
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='none';
  nowBox.classList.remove('playing'); nowBox.classList.add('idle');
  nowTag.textContent="播完"; nowName.textContent=nowName.textContent+" · 完成";
});

/* ===== 手機 / 藍牙音箱播放（音訊檔完全未改） ===== */
let currentNum = null, wakeLock = null;
const awakeEl = document.getElementById('awakeState');
const ORDER = [0,"00"].concat(
  Object.keys(players).map(Number).filter(n=>n!==100).sort((a,b)=>a-b)
).concat([100]);

function setAwakeHint(ok){
  if(!awakeEl) return;
  awakeEl.textContent = ok ? '已啟用'
    : ('wakeLock' in navigator ? '未啟用' : '不支援，請手動關閉自動鎖定');
  awakeEl.style.color = ok ? '#7ee787' : 'var(--gold)';
}

async function keepAwake(on){
  if(!('wakeLock' in navigator)){ setAwakeHint(false); return; }
  try{
    if(on){
      if(!wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; setAwakeHint(false); });
      }
      setAwakeHint(true);
    }else{
      if(wakeLock){ await wakeLock.release(); wakeLock = null; }
      setAwakeHint(false);
    }
  }catch(e){ setAwakeHint(false); }
}

function playNext(dir){
  if(currentNum===null) return;
  let i = ORDER.findIndex(n => String(n)===String(currentNum));
  if(i<0) i=0;
  play(ORDER[(i+dir+ORDER.length)%ORDER.length]);
}

function setMedia(item){
  if(!('mediaSession' in navigator)) return;
  const tag = (item.number===0) ? '換場音樂'
            : (item.number==='00') ? '終結者 CLOSER'
            : (item.number===100) ? '完整音樂' : ('#'+item.number+' 上場音樂');
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: item.name,
      artist: 'LIONS BLACK · '+tag,
      album: '出場音樂 · '+(item.nick||'')
    });
    navigator.mediaSession.playbackState = 'playing';
    const A = {
      play:  ()=>{ audio.play().catch(()=>{}); },
      pause: ()=>{ audio.pause(); },
      stop:  ()=>{ stop(); },
      previoustrack: ()=>playNext(-1),
      nexttrack:     ()=>playNext(1)
    };
    for(const k in A){ try{ navigator.mediaSession.setActionHandler(k, A[k]); }catch(e){} }
  }catch(e){}
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && !audio.paused) keepAwake(true);
});
audio.addEventListener('play',  ()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing'; });
audio.addEventListener('pause', ()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused'; });
</script>
</body>
</html>
